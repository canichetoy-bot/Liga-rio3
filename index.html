<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liga Regional</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

/* =========================
   HEADER
========================= */

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    color: #d1d5db;
}


/* =========================
   BOTON MENU
========================= */

.menu-btn {
    position: fixed;
    right: 20px;
    top: 20px;

    width: 50px;
    height: 50px;

    border: none;
    border-radius: 10px;

    background: #2563eb;
    color: white;

    font-size: 24px;

    cursor: pointer;

    z-index: 1001;
}

.menu-btn:hover {
    background: #1d4ed8;
}


/* =========================
   MENU LATERAL
========================= */

.menu-lateral {

    position: fixed;

    top: 0;
    right: -300px;

    width: 300px;
    height: 100vh;

    background: #111827;

    color: white;

    padding: 80px 20px 20px;

    transition: right 0.3s ease;

    z-index: 1000;

    box-shadow: -5px 0 15px rgba(0,0,0,0.25);
}

.menu-lateral.abierto {
    right: 0;
}

.menu-lateral h2 {
    margin-top: 0;
    border-bottom: 1px solid #374151;
    padding-bottom: 15px;
}

.menu-opcion {

    width: 100%;

    padding: 15px;

    margin-bottom: 10px;

    border: none;

    border-radius: 8px;

    background: #374151;

    color: white;

    font-size: 17px;

    font-weight: bold;

    text-align: left;

    cursor: pointer;
}

.menu-opcion:hover {
    background: #2563eb;
}

.menu-opcion.activo {
    background: #2563eb;
}


/* =========================
   FONDO MENU
========================= */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.4);

    display: none;

    z-index: 999;
}

.overlay.visible {
    display: block;
}


/* =========================
   NAVEGACION
========================= */

nav {

    background: #1f2937;

    display: flex;

    justify-content: center;

    gap: 10px;

    padding: 12px;

    flex-wrap: wrap;
}

nav button {

    background: #374151;

    color: white;

    border: none;

    padding: 10px 18px;

    border-radius: 6px;

    cursor: pointer;

    font-weight: bold;
}

nav button:hover,
nav button.active {

    background: #2563eb;
}


/* =========================
   CONTENEDOR
========================= */

.container {

    max-width: 1100px;

    margin: auto;

    padding: 20px;
}

.seccion {

    background: white;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}


/* =========================
   CATEGORIA ACTUAL
========================= */

.categoria-actual {

    display: inline-block;

    background: #2563eb;

    color: white;

    padding: 7px 12px;

    border-radius: 6px;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 15px;
}


/* =========================
   TABLA
========================= */

.tabla-container {
    overflow-x: auto;
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 650px;
}

th {

    background: #111827;

    color: white;

    padding: 10px;

    font-size: 14px;
}

td {

    padding: 10px;

    border-bottom: 1px solid #e5e7eb;

    text-align: center;
}

td:nth-child(2) {

    text-align: left;

    font-weight: bold;
}

tr:hover {

    background: #f9fafb;
}

.posicion {

    font-weight: bold;
}


/* =========================
   FECHAS
========================= */

.selector-fecha {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-bottom: 20px;
}

.selector-fecha button {

    border: none;

    background: #e5e7eb;

    padding: 9px 13px;

    border-radius: 6px;

    cursor: pointer;
}

.selector-fecha button:hover,
.selector-fecha button.active {

    background: #2563eb;

    color: white;
}


/* =========================
   PARTIDOS
========================= */

.partido {

    border: 1px solid #e5e7eb;

    border-radius: 8px;

    padding: 15px;

    margin-bottom: 12px;

    background: white;
}

.partido-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;
}

.estado {

    font-size: 12px;

    font-weight: bold;

    padding: 5px 8px;

    border-radius: 5px;

    background: #e5e7eb;
}

.estado.finalizado {

    background: #dcfce7;

    color: #166534;
}

.equipos {

    display: grid;

    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    gap: 15px;
}

.equipo {

    font-weight: bold;
}

.local {

    text-align: right;
}

.visitante {

    text-align: left;
}

.resultado {

    font-size: 24px;

    font-weight: bold;

    white-space: nowrap;
}


/* =========================
   ADMIN
========================= */

select {

    padding: 10px;

    border-radius: 6px;

    border: 1px solid #d1d5db;

    font-size: 15px;
}

.admin-partido {

    display: grid;

    grid-template-columns: 1fr 70px 20px 70px 1fr;

    gap: 8px;

    align-items: center;

    margin-bottom: 10px;
}

.admin-partido input {

    width: 100%;

    padding: 8px;

    border: 1px solid #d1d5db;

    border-radius: 5px;

    text-align: center;
}

.admin-partido button {

    border: none;

    background: #16a34a;

    color: white;

    padding: 8px;

    border-radius: 5px;

    cursor: pointer;
}

.admin-equipo {

    font-size: 14px;

    font-weight: bold;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 10px;
    }

    .seccion {
        padding: 15px;
    }

    .equipos {

        grid-template-columns: 1fr;

        text-align: center;

        gap: 8px;
    }

    .local,
    .visitante {

        text-align: center;
    }

    .admin-partido {

        grid-template-columns:
        1fr 55px 15px 55px;
    }

    .admin-partido button {

        grid-column: 1 / -1;
    }

    .menu-lateral {

        width: 280px;
    }
}

</style>
</head>


<body>


<!-- =========================
     BOTON MENU
========================= -->

    class="menu-btn"
    onclick="toggleMenu()">

</button>


<!-- =========================
     OVERLAY

<!-- =========================

<header>

<!-- =========================
     NAVEGACION

<nav>

    <button

<div class="container">


<!-- =========================
     TABLA
========================= -->

<section

    </div>

</section>


<!-- =========================
     FIXTURE
========================= -->

<section
    id="fixture"
    class="seccion">

    <div
        id="categoriaFixture"
        class="categoria-actual">

        Primera

    </div>

    <h2>
        📅 Fixture

    <div

    </div>

    <div

    </div>

</section>


<!-- =========================
     RESULTADOS
========================= -->

<section
    id="resultados"
    class="seccion">

    <div
        id="categoriaResultados"

    </div>

    <h2>
        ⚽ Cargar resultados
    </h2>

    <p>
        Seleccioná una fecha y cargá los resultados.
    </p>

    <select
        id="fechaAdmin"

    </select>

    <div
        id="adminPartidos"
        style="margin-top:20px;">
    </div>

</section>


</div>

13: [

15: [

16: [

["Recreativo Elenense","Social y Deportivo VGB"],

};


/* =========================================================
   CATEGORIA
========================================================= */

let categoriaActual = "primera";


/*
   Los resultados se guardan separados:

   primera_resultados
   reserva_resultados
*/

let resultadosPrimera =
    JSON.parse(localStorage.getItem("primera_resultados")) || {};

let resultadosReserva =
    JSON.parse(localStorage.getItem("reserva_resultados")) || {};


/* =========================================================
   OBTENER RESULTADOS
========================================================= */

function obtenerResultados() {

    if (categoriaActual === "primera") {

        return resultadosPrimera;

    } else {

        return resultadosReserva;

    }

}


/* =========================================================
   CAMBIAR CATEGORIA
========================================================= */

function cambiarCategoria(categoria) {

    categoriaActual = categoria;


    /*
       Cambiar botones
    */

    document
        .getElementById("btnPrimera")
        .classList.remove("activo");

    document
        .getElementById("btnReserva")
        .classList.remove("activo");


    if (categoria === "primera") {

        document
            .getElementById("btnPrimera")
            .classList.add("activo");

    } else {

        document
            .getElementById("btnReserva")
            .classList.add("activo");

    }


    /*
       Cambiar textos
    */

    const nombre =
        categoria === "primera"
            ? "Primera"
            : "Reserva";


    document.getElementById("categoriaTabla")
        .textContent = nombre;

    document.getElementById("categoriaFixture")
        .textContent = nombre;

    document.getElementById("categoriaResultados")
        .textContent = nombre;


    /*
       Actualizar todo
    */

    actualizarTabla();

    mostrarFecha(fechaActual);

    mostrarAdmin();


    /*
       Cerrar menú
    */

    cerrarMenu();

}


/* =========================================================
   MENU
========================================================= */

function toggleMenu() {

    document
        .getElementById("menuLateral")
        .classList.toggle("abierto");

    document
        .getElementById("overlay")
        .classList.toggle("visible");

}


function cerrarMenu() {

    document
        .getElementById("menuLateral")
        .classList.remove("abierto");

    document
        .getElementById("overlay")
        .classList.remove("visible");

}


/* =========================================================
   SECCIONES
========================================================= */

function mostrarSeccion(seccion) {

    document.getElementById("tabla").style.display = "none";

    document.getElementById("fixture").style.display = "none";

    document.getElementById("resultados").style.display = "none";


    document.getElementById(seccion).style.display = "block";


    document
        .getElementById("btnTabla")
        .classList.remove("active");

    document
        .getElementById("btnFixture")
        .classList.remove("active");

    document
        .getElementById("btnResultados")
        .classList.remove("active");


    if (seccion === "tabla") {

        document
            .getElementById("btnTabla")
            .classList.add("active");

    }


    if (seccion === "fixture") {

        document
            .getElementById("btnFixture")
            .classList.add("active");

    }


    if (seccion === "resultados") {

        document
            .getElementById("btnResultados")
            .classList.add("active");

    }

}


/* =========================================================
   FECHA ACTUAL
========================================================= */

let fechaActual = 1;


/* =========================================================
   CREAR SELECTOR DE FECHAS
========================================================= */

function crearSelectorFechas() {

    const contenedor =
        document.getElementById("selectorFechas");


    for (let fecha = 1; fecha <= 16; fecha++) {

        const boton =
            document.createElement("button");


        boton.textContent =
            "Fecha " + fecha;


        boton.onclick = function() {

            mostrarFecha(fecha);

        };


        if (fecha === 1) {

            boton.classList.add("active");

        }


        contenedor.appendChild(boton);

    }

}


/* =========================================================
   MOSTRAR FECHA
========================================================= */

function mostrarFecha(fecha) {

    fechaActual = fecha;


    const contenedor =
        document.getElementById("partidos");


    contenedor.innerHTML = "";


    document
        .querySelectorAll("#selectorFechas button")
        .forEach(boton =>
            boton.classList.remove("active")
        );


    document
        .querySelectorAll("#selectorFechas button")
        [fecha - 1]
        .classList.add("active");


    const resultados =
        obtenerResultados();


    fixture[fecha].forEach((partido, indice) => {

        const local = partido[0];

        const visitante = partido[1];


        const id =
            fecha + "-" + indice;


        const resultado =
            resultados[id];


        let marcador = "-";

        let estado = "Pendiente";

        let claseEstado = "";


        if (resultado) {

            marcador =
                resultado.golesLocal +
                " - " +
                resultado.golesVisitante;


            estado = "Finalizado";

            claseEstado = "finalizado";

        }


        const div =
            document.createElement("div");


        div.className = "partido";


        div.innerHTML = `

            <div class="partido-header">

                <strong>
                    Partido ${indice + 1}
                </strong>

                <span class="estado ${claseEstado}">
                    ${estado}
                </span>

            </div>

            <div class="equipos">

                <div class="equipo local">
                    ${local}
                </div>

                <div class="resultado">
                    ${marcador}
                </div>

                <div class="equipo visitante">
                    ${visitante}
                </div>

            </div>

        `;


        contenedor.appendChild(div);

    });

}


/* =========================================================
   SELECTOR ADMIN
========================================================= */

function crearSelectorAdmin() {

    const select =
        document.getElementById("fechaAdmin");


    for (let fecha = 1; fecha <= 16; fecha++) {

        const option =
            document.createElement("option");


        option.value = fecha;

        option.textContent =
            "Fecha " + fecha;


        select.appendChild(option);

    }

}


/* =========================================================
   MOSTRAR ADMIN
========================================================= */

function mostrarAdmin() {

    const fecha =
        Number(
            document.getElementById("fechaAdmin").value
        );


    const contenedor =
        document.getElementById("adminPartidos");


    contenedor.innerHTML = "";


    const resultados =
        obtenerResultados();


    fixture[fecha].forEach((partido, indice) => {

        const local = partido[0];

        const visitante = partido[1];


        const id =
            fecha + "-" + indice;


        const resultado =
            resultados[id] || {};


        const div =
            document.createElement("div");


        div.className =
            "admin-partido";


        div.innerHTML = `

            <div class="admin-equipo">
                ${local}
            </div>

            <input
                type="number"
                min="0"
                id="local-${id}"
                value="${resultado.golesLocal ?? ""}"
                placeholder="0"
            >

            <strong>-</strong>

            <input
                type="number"
                min="0"
                id="visitante-${id}"
                value="${resultado.golesVisitante ?? ""}"
                placeholder="0"
            >

            <div class="admin-equipo">
                ${visitante}
            </div>

            <button
                onclick="guardarResultado(${fecha}, ${indice})">

                Guardar

            </button>

        `;


        contenedor.appendChild(div);

    });

}


/* =========================================================
   GUARDAR RESULTADO
========================================================= */

function guardarResultado(fecha, indice) {

    const id =
        fecha + "-" + indice;


    const golesLocal =
        document.getElementById(
            "local-" + id
        ).value;


    const golesVisitante =
        document.getElementById(
            "visitante-" + id
        ).value;


    if (
        golesLocal === "" ||
        golesVisitante === ""
    ) {

        alert(
            "Completá los dos resultados."
        );

        return;

    }


    const resultado = {

        golesLocal:
            Number(golesLocal),

        golesVisitante:
            Number(golesVisitante)

    };


    if (categoriaActual === "primera") {

        resultadosPrimera[id] =
            resultado;


        localStorage.setItem(
            "primera_resultados",
            JSON.stringify(resultadosPrimera)
        );

    } else {

        resultadosReserva[id] =
            resultado;


        localStorage.setItem(
            "reserva_resultados",
            JSON.stringify(resultadosReserva)
        );

    }


    alert(
        "Resultado guardado correctamente."
    );


    mostrarAdmin();

    mostrarFecha(fecha);

    actualizarTabla();

}


/* =========================================================
   TABLA
========================================================= */

function actualizarTabla() {

    const resultados =
        obtenerResultados();


    let tabla = {};


    equipos.forEach(equipo => {

        tabla[equipo] = {

            equipo: equipo,

            pts: 0,

            pj: 0,

            pg: 0,

            pe: 0,

            pp: 0,

            gf: 0,

            gc: 0,

            dg: 0

        };

    });


    Object.keys(resultados)
        .forEach(id => {

            const partes =
                id.split("-");


            const fecha =
                Number(partes[0]);


            const indice =
                Number(partes[1]);


            const partido =
                fixture[fecha][indice];


            const local =
                partido[0];


            const visitante =
                partido[1];


            const golesLocal =
                resultados[id].golesLocal;


            const golesVisitante =
                resultados[id].golesVisitante;


            tabla[local].pj++;

            tabla[visitante].pj++;


            tabla[local].gf +=
                golesLocal;

            tabla[local].gc +=
                golesVisitante;


            tabla[visitante].gf +=
                golesVisitante;

            tabla[visitante].gc +=
                golesLocal;


            if (
                golesLocal >
                golesVisitante
            ) {

                tabla[local].pg++;

                tabla[local].pts += 3;

                tabla[visitante].pp++;

            }

            else if (
                golesLocal <
                golesVisitante
            ) {

                tabla[visitante].pg++;

                tabla[visitante].pts += 3;

                tabla[local].pp++;

            }

            else {

                tabla[local].pe++;

                tabla[visitante].pe++;

                tabla[local].pts++;

                tabla[visitante].pts++;

            }

        });


    Object.values(tabla)
        .forEach(equipo => {

            equipo.dg =
                equipo.gf -
                equipo.gc;

        });


    const posiciones =
        Object.values(tabla)
        .sort((a,b) => {

            if (
                b.pts !== a.pts
            ) {

                return b.pts -
                       a.pts;

            }


            if (
                b.dg !== a.dg
            ) {

                return b.dg -
                       a.dg;

            }


            if (
                b.gf !== a.gf
            ) {

                return b.gf -
                       a.gf;

            }


            return a.equipo.localeCompare(
                b.equipo
            );

        });


    const tbody =
        document.getElementById(
            "tablaPosiciones"
        );


    tbody.innerHTML = "";


    posiciones.forEach(
        (equipo, indice) => {

            const tr =
                document.createElement("tr");


            tr.innerHTML = `

                <td class="posicion">
                    ${indice + 1}
                </td>

                <td>
                    ${equipo.equipo}
                </td>

                <td>
                    <strong>
                        ${equipo.pts}
                    </strong>
                </td>

                <td>${equipo.pj}</td>

                <td>${equipo.pg}</td>

                <td>${equipo.pe}</td>

                <td>${equipo.pp}</td>

                <td>${equipo.gf}</td>

                <td>${equipo.gc}</td>

                <td>${equipo.dg}</td>

            `;


            tbody.appendChild(tr);

        }
    );

}


/* =========================================================
   INICIAR
========================================================= */

crearSelectorFechas();

crearSelectorAdmin();

mostrarFecha(1);

mostrarAdmin();

actualizarTabla();

mostrarSeccion("tabla");

</script>
