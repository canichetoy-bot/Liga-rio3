        .getElementById("categoriaResultados")
        .textContent = nombre;


    cerrarMenu();


    await cargarResultados();

    mostrarFecha(fechaActual);

    mostrarAdmin();

    actualizarTabla();

}


/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    document
        .getElementById("menuLateral")
        .classList.toggle("abierto");

    document
        .getElementById("overlay")
        .classList.toggle("visible");

}


function cerrarMenu() {

    document
        .getElementById("menuLateral")
        .classList.remove("abierto");

    document
        .getElementById("overlay")
        .classList.remove("visible");

}


/* =====================================================
   SECCIONES
===================================================== */

function mostrarSeccion(seccion) {

    document
        .getElementById("tabla")
        .style.display = "none";


    document
        .getElementById("fixture")
        .style.display = "none";


    document
        .getElementById("resultados")
        .style.display = "none";


    /*
       Seguridad adicional:
       si alguien intenta abrir administración
       sin estar logueado, no se lo permitimos.
    */

    if (seccion === "resultados") {

        const btnAdmin =
            document.getElementById("btnAdmin");


        if (
            btnAdmin.style.display === "none"
        ) {

            abrirLogin();

            return;

        }

    }


    document
        .getElementById(seccion)
        .style.display = "block";


    document
        .getElementById("btnTabla")
        .classList.remove("active");


    document
        .getElementById("btnFixture")
        .classList.remove("active");


    document
        .getElementById("btnAdmin")
        .classList.remove("active");


    if (seccion === "tabla") {

        document
            .getElementById("btnTabla")
            .classList.add("active");

    }


    if (seccion === "fixture") {

        document
            .getElementById("btnFixture")
            .classList.add("active");

    }


    if (seccion === "resultados") {

        document
            .getElementById("btnAdmin")
            .classList.add("active");

    }

}


/* =====================================================
   CARGAR RESULTADOS DESDE SUPABASE
===================================================== */

async function cargarResultados() {

    resultadosActuales = {};


    const {
        data,
        error
    } = await supabaseClient

        .from("partidos")

        .select("*")

        .eq(
            "categoria",
            nombreCategoria()
        );


    if (error) {

        console.error(
            "Error cargando resultados:",
            error
        );

        return;

    }


    data.forEach(partido => {

        /*
           Usamos el número de partido
           según la fecha y posición.
        */

        const partidosFecha =
            fixture[partido.fecha];


        if (!partidosFecha) return;


        const indice =
            partidosFecha.findIndex(
                p =>
                    p[0] === partido.local &&
                    p[1] === partido.visitante
            );


        if (indice === -1) return;


        const id =
            partido.fecha + "-" + indice;


        resultadosActuales[id] = {

            id: partido.id,

            golesLocal:
                partido.goles_local,

            golesVisitante:
                partido.goles_visitante,

            estado:
                partido.estado

        };

    });

}


/* =====================================================
   CREAR SELECTOR DE FECHAS
===================================================== */

function crearSelectorFechas() {

    const contenedor =
        document.getElementById(
            "selectorFechas"
        );


    contenedor.innerHTML = "";


    for (
        let fecha = 1;
        fecha <= 16;
        fecha++
    ) {

        const boton =
            document.createElement(
                "button"
            );


        boton.textContent =
            "Fecha " + fecha;


        boton.onclick =
            function() {

                mostrarFecha(fecha);

            };


        if (fecha === 1) {

            boton.classList.add(
                "active"
            );

        }


        contenedor.appendChild(
            boton
        );

    }

}


/* =====================================================
   MOSTRAR FECHA
===================================================== */

function mostrarFecha(fecha) {

    fechaActual = fecha;


    const contenedor =
        document.getElementById(
            "partidos"
        );


    contenedor.innerHTML = "";


    document
        .querySelectorAll(
            "#selectorFechas button"
        )
        .forEach(
            boton =>
                boton.classList.remove(
                    "active"
                )
        );


    const botonActivo =
        document.querySelectorAll(
            "#selectorFechas button"
        )[fecha - 1];


    if (botonActivo) {

        botonActivo.classList.add(
            "active"
        );

    }


    const partidos =
        fixture[fecha];


    if (!partidos) return;


    partidos.forEach(
        (partido, indice) => {

            const local =
                partido[0];

            const visitante =
                partido[1];


            const id =
                fecha + "-" + indice;


            const resultado =
                resultadosActuales[id];


            let marcador = "-";

            let estado =
                "Pendiente";

            let claseEstado = "";


            if (
                resultado &&
                resultado.golesLocal !== null &&
                resultado.golesVisitante !== null
            ) {

                marcador =
                    resultado.golesLocal +
                    " - " +
                    resultado.golesVisitante;


                estado =
                    "Finalizado";


                claseEstado =
                    "finalizado";

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "partido";


            div.innerHTML = `

                <div class="partido-header">

                    <strong>
                        Partido ${indice + 1}
                    </strong>

                    <span
                        class="estado ${claseEstado}">
                        ${estado}
                    </span>

                </div>


                <div class="equipos">

                    <div class="equipo local">
                        ${local}
                    </div>


                    <div class="resultado">
                        ${marcador}
                    </div>


                    <div class="equipo visitante">
                        ${visitante}
                    </div>

                </div>

            `;


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SELECTOR ADMIN
===================================================== */

function crearSelectorAdmin() {

    const select =
        document.getElementById(
            "fechaAdmin"
        );


    select.innerHTML = "";


    for (
        let fecha = 1;
        fecha <= 16;
        fecha++
    ) {

            );

        option.textContent =

        );

/* =====================================================
   MOSTRAR ADMIN
===================================================== */

function mostrarAdmin() {

    const select =
        document.getElementById(
            "fechaAdmin"
        );


    if (!select) return;


    const fecha =
        Number(select.value);


    const contenedor =
        document.getElementById(
            "adminPartidos"
        );


    contenedor.innerHTML = "";


    const partidos =
        fixture[fecha];


    if (!partidos) return;


    partidos.forEach(
        (partido, indice) => {

            const local =
                partido[0];

            const visitante =
                partido[1];


            const id =
                fecha + "-" + indice;


            const resultado =
                resultadosActuales[id] ||
                {};


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "admin-partido";


            div.innerHTML = `

                <div class="admin-equipo">
                    ${local}
                </div>


                <input
                    type="number"
                    min="0"
                    id="local-${id}"
                    value="${
                        resultado.golesLocal ??
                        ""
                    }"
                    placeholder="0"
                >


                <strong>-</strong>


                <input
                    type="number"
                    min="0"
                    id="visitante-${id}"
                    value="${
                        resultado.golesVisitante ??
                        ""
                    }"
                    placeholder="0"
                >


                <div class="admin-equipo">
                    ${visitante}
                </div>


                <button
                    onclick="
                        guardarResultado(
                            ${fecha},
                            ${indice}
                        )
                    ">

                    Guardar

                </button>

            `;


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   GUARDAR RESULTADO
===================================================== */

async function guardarResultado(
    fecha,
    indice
) {


    /*
       Comprobar sesión
    */

    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if (!session) {

        alert(
            "Necesitás iniciar sesión."
        );

        abrirLogin();

        return;

    }


    const id =
        fecha + "-" + indice;


    const inputLocal =
        document.getElementById(
            "local-" + id
        );


    const inputVisitante =
        document.getElementById(
            "visitante-" + id
        );


    const golesLocal =
        inputLocal.value;


    const golesVisitante =
        inputVisitante.value;


    if (
        golesLocal === "" ||
        golesVisitante === ""
    ) {

        alert(
            "Completá los dos resultados."
        );

        return;

    }


    const partido =
        fixture[fecha][indice];


    const local =
        partido[0];

    const visitante =
        partido[1];


    /*
       Comprobar si ya existe
    */

    const resultadoAnterior =
        resultadosActuales[id];


    let response;


    if (
        resultadoAnterior &&
        resultadoAnterior.id
    ) {

        /*
           ACTUALIZAR
        */

        response =
            await supabaseClient

                .from("partidos")

                .update({

                    goles_local:
                        Number(
                            golesLocal
                        ),

                    goles_visitante:
                        Number(
                            golesVisitante
                        ),

                    estado:
                        "Finalizado",

                    updated_at:
                        new Date()
                            .toISOString()

                })

                .eq(
                    "id",
                    resultadoAnterior.id
                );

    } else {

        /*
           CREAR
        */

        response =
            await supabaseClient

                .from("partidos")

                .insert({

                    fecha:
                        fecha,

                    categoria:
                        nombreCategoria(),

                    local:
                        local,

                    visitante:
                        visitante,

                    goles_local:
                        Number(
                            golesLocal
                        ),

                    goles_visitante:
                        Number(
                            golesVisitante
                        ),

                    estado:
                        "Finalizado"

                });

    }


    if (response.error) {

        console.error(
            response.error
        );


        alert(
            "No se pudo guardar el resultado.\n\n" +
            response.error.message
        );


        return;

    }


    alert(
        "✅ Resultado guardado correctamente."
    );


    /*
       Volver a cargar desde Supabase
    */

    await cargarResultados();


    mostrarAdmin();

    mostrarFecha(fecha);

    actualizarTabla();

}


/* =====================================================
   TABLA DE POSICIONES
===================================================== */

function actualizarTabla() {

    const tabla = {};


    equipos.forEach(
        equipo => {

            tabla[equipo] = {

                equipo:
                    equipo,

                pts: 0,

                pj: 0,

                pg: 0,

                pe: 0,

                pp: 0,

                gf: 0,

                gc: 0,

                dg: 0

            };

        }
    );


    Object.keys(
        resultadosActuales
    ).forEach(
        id => {

            const partes =
                id.split("-");


            const fecha =
                Number(partes[0]);


            const indice =
                Number(partes[1]);


            const partido =
                fixture[fecha][indice];


            if (!partido) return;


            const local =
                partido[0];

            const visitante =
                partido[1];


            const resultado =
                resultadosActuales[id];


            if (
                resultado.golesLocal === null ||
                resultado.golesVisitante === null
            ) {

                return;

            }


            const golesLocal =
                Number(
                    resultado.golesLocal
                );


            const golesVisitante =
                Number(
                    resultado.golesVisitante
                );


            tabla[local].pj++;

            tabla[visitante].pj++;


            tabla[local].gf +=
                golesLocal;

            tabla[local].gc +=
                golesVisitante;


            tabla[visitante].gf +=
                golesVisitante;

            tabla[visitante].gc +=
                golesLocal;


            if (
                golesLocal >
                golesVisitante
            ) {

                tabla[local].pg++;

                tabla[local].pts += 3;

                tabla[visitante].pp++;

            }

            else if (
                golesLocal <
                golesVisitante
            ) {

                tabla[visitante].pg++;

                tabla[visitante].pts += 3;

                tabla[local].pp++;

            }

            else {

                tabla[local].pe++;

                tabla[visitante].pe++;

                tabla[local].pts++;

                tabla[visitante].pts++;

            }

        }
    );


    Object.values(tabla)
        .forEach(
            equipo => {

                equipo.dg =
                    equipo.gf -
                    equipo.gc;

            }
        );


    const posiciones =
        Object.values(tabla)
        .sort(
            (a,b) => {

                if (
                    b.pts !==
                    a.pts
                ) {

                    return b.pts -
                           a.pts;

                }


                if (
                    b.dg !==
                    a.dg
                ) {

                    return b.dg -
                           a.dg;

                }


                if (
                    b.gf !==
                    a.gf
                ) {

                    return b.gf -
                           a.gf;

                }


                return a.equipo
                    .localeCompare(
                        b.equipo
                    );

            }
        );


    const tbody =
        document.getElementById(
            "tablaPosiciones"
        );


    tbody.innerHTML = "";


    posiciones.forEach(
        (equipo, indice) => {

            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td class="posicion">
                    ${indice + 1}
                </td>

                <td>
                    ${equipo.equipo}
                </td>

                <td>
                    <strong>
                        ${equipo.pts}
                    </strong>
                </td>

                <td>
                    ${equipo.pj}
                </td>

                <td>
                    ${equipo.pg}
                </td>

                <td>
                    ${equipo.pe}
                </td>

                <td>
                    ${equipo.pp}
                </td>

                <td>
                    ${equipo.gf}
                </td>

                <td>
                    ${equipo.gc}
                </td>

                <td>
                    ${equipo.dg}
                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =====================================================
   LOGIN
===================================================== */

function abrirLogin() {

    document
        .getElementById(
            "loginBox"
        )
        .style.display = "flex";


    document
        .getElementById(
            "loginMensaje"
        )
        .textContent = "";

}


function cerrarLogin() {

    document
        .getElementById(
            "loginBox"
        )
        .style.display = "none";

}


/* =====================================================
   INICIAR SESION
===================================================== */

async function iniciarSesion() {

    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;


    const mensaje =
        document
            .getElementById(
                "loginMensaje"
            );


    mensaje.textContent = "";


    if (
        !email ||
        !password
    ) {

        mensaje.textContent =
            "Completá el correo y la contraseña.";

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


    if (error) {

        console.error(error);


        mensaje.textContent =
            "❌ Correo o contraseña incorrectos.";

        return;

    }


    console.log(
        "Administrador conectado:",
        data.user.email
    );


    cerrarLogin();


    actualizarEstadoLogin();


    /*
       Abrir administración
    */

    mostrarSeccion(
        "resultados"
    );


    mostrarAdmin();

}


/* =====================================================
   CERRAR SESION
===================================================== */

async function cerrarSesion() {

    await supabaseClient
        .auth
        .signOut();


    actualizarEstadoLogin();


    mostrarSeccion(
        "tabla"
    );


    alert(
        "Sesión cerrada."
    );

}


/* =====================================================
   COMPROBAR ESTADO LOGIN
===================================================== */

async function actualizarEstadoLogin() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    const btnAdmin =
        document.getElementById(
            "btnAdmin"
        );


    const btnLogin =
        document.getElementById(
            "btnLogin"
        );


    const usuario =
        document.getElementById(
            "usuarioLogueado"
        );


    if (session) {

        /*
           LOGUEADO
        */

        btnAdmin.style.display =
            "block";


        btnLogin.textContent =
            "🚪 Cerrar sesión";


        btnLogin.onclick =
            cerrarSesion;


        if (usuario) {

            usuario.innerHTML =
                "👤 Sesión iniciada como: <strong>" +
                session.user.email +
                "</strong>";

        }

    } else {

        /*
           NO LOGUEADO
        */

        btnAdmin.style.display =
            "none";


        btnLogin.textContent =
            "🔐 Admin";


        btnLogin.onclick =
            abrirLogin;


        if (usuario) {

            usuario.textContent = "";

        }

    }

}


/* =====================================================
   DETECTAR CAMBIOS DE SESION
===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        function(
            event,
            session
        ) {

            actualizarEstadoLogin();

        }
    );


/* =====================================================
   INICIAR PAGINA
===================================================== */

async function iniciarPagina() {

    crearSelectorFechas();

    crearSelectorAdmin();


    await cargarResultados();


    mostrarFecha(1);

    mostrarAdmin();

    actualizarTabla();


    mostrarSeccion(
        "tabla"
    );


    actualizarEstadoLogin();

}


iniciarPagina();

</script>
